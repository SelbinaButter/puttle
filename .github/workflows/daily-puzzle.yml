name: Publish daily green

on:
  push:
    branches: [main]
  schedule:
    - cron: '8 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep generated future dates between scheduled runs, but never allow a
      # cache entry to overwrite the archive committed in the checkout. The
      # compatibility hash also prevents puzzles from an older generator or
      # simulation from leaking into a new archive build.
      - name: Restore compatible generated archive
        uses: actions/cache@v4
        with:
          path: |
            .archive-cache/puzzles
            .generated/solutions
          key: puzzle-archive-v3-${{ hashFiles('scripts/lib/*.ts', 'src/sim/*.ts', 'public/puzzles/*.json') }}-${{ github.run_id }}
          restore-keys: |
            puzzle-archive-v3-${{ hashFiles('scripts/lib/*.ts', 'src/sim/*.ts', 'public/puzzles/*.json') }}-
      - name: Add cached dates missing from the checkout
        run: |
          mkdir -p .archive-cache/puzzles public/puzzles
          find .archive-cache/puzzles -maxdepth 1 -type f -name '*.json' -print0 | while IFS= read -r -d '' source; do
            target="public/puzzles/$(basename "$source")"
            if [ ! -e "$target" ]; then cp "$source" "$target"; fi
          done
      - name: Generate through tomorrow for local-midnight releases
        run: |
          tomorrow="$(node -p 'new Date(Date.now() + 86400000).toISOString().slice(0, 10)')"
          npx tsx scripts/generate.ts --from 2026-01-01 --through "$tomorrow" --missing
          cp -a public/puzzles/. .archive-cache/puzzles/
      - name: Audit deployed archive layouts
        run: npm run audit:layouts
      - name: Verify the local-time release window is in the archive
        run: |
          today="$(date -u +%F)"
          tomorrow="$(node -p 'new Date(Date.now() + 86400000).toISOString().slice(0, 10)')"
          test -f "public/puzzles/${today}.json"
          test -f "public/puzzles/${tomorrow}.json"
          node -e 'const fs=require("node:fs"); const today=new Date(); const dates=[today, new Date(today.getTime()+86400000)].map(date=>date.toISOString().slice(0,10)); const index=JSON.parse(fs.readFileSync("public/puzzles/index.json","utf8")); for (const date of dates) if (!index.dates.includes(date)) throw new Error(`Puzzle index does not contain ${date}`)'
      - run: npm test
        env:
          CI: true
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
