name: Publish daily green

on:
  push:
    branches: [main]
  schedule:
    - cron: '8 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore validated puzzle archive
        uses: actions/cache@v4
        with:
          path: |
            public/puzzles
            .generated/solutions
          key: puzzle-archive-v2-${{ github.run_id }}
          restore-keys: puzzle-archive-v2-
      - name: Generate through tomorrow for local-midnight releases
        run: |
          tomorrow="$(node -p 'new Date(Date.now() + 86400000).toISOString().slice(0, 10)')"
          npx tsx scripts/generate.ts --from 2026-01-01 --through "$tomorrow" --missing
      - name: Verify the local-time release window is in the archive
        run: |
          today="$(date -u +%F)"
          tomorrow="$(node -p 'new Date(Date.now() + 86400000).toISOString().slice(0, 10)')"
          test -f "public/puzzles/${today}.json"
          test -f "public/puzzles/${tomorrow}.json"
          node -e 'const fs=require("node:fs"); const today=new Date(); const dates=[today, new Date(today.getTime()+86400000)].map(date=>date.toISOString().slice(0,10)); const index=JSON.parse(fs.readFileSync("public/puzzles/index.json","utf8")); for (const date of dates) if (!index.dates.includes(date)) throw new Error(`Puzzle index does not contain ${date}`)'
      - run: npm test
        env:
          CI: true
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
